<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Sky High Structures</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <style>
        .error-page {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-top: 100px;
        }
        .error-page h1 {
            font-size: 8rem;
            color: var(--gold-accent);
            font-family: 'Cormorant Garamond', serif;
            margin: 0;
            line-height: 1;
        }
        .error-page h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
        }
        #cube-canvas {
            width: 200px;
            height: 200px;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <!-- Sticky Navigation -->
    <nav id="navbar" style="background: rgba(13, 27, 42, 0.95); backdrop-filter: blur(10px);">
        <div class="container nav-container">
            <div class="logo">
                <span class="logo-monogram">SHS</span>
                <span class="logo-text"><a href="/" style="color:var(--white);text-decoration:none;">Sky High Structures</a></span>
            </div>
            <ul class="nav-links">
                <li><a href="/">Go Home</a></li>
            </ul>
        </div>
    </nav>

    <!-- 404 Content -->
    <div class="error-page container">
        <h1>404</h1>
        <h2>Oops! The page you're looking for doesn't exist.</h2>
        <a href="/" class="btn-primary">Go Back Home</a>
        <div id="cube-canvas"></div>
    </div>

    <!-- Footer -->
    <footer style="margin-top: 4rem;">
        <div class="container footer-bottom">
            <p>&copy; 2026 Sky High Structures. All rights reserved.</p>
        </div>
    </footer>

    <!-- Three.js for 3D Cube -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('cube-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(200, 200);
        container.appendChild(renderer.domElement);
        
        const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const material = new THREE.MeshBasicMaterial({ 
            color: 0xc8a84b, 
            wireframe: true, 
            transparent: true,
            opacity: 0.8
        });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        
        camera.position.z = 3;
        
        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
